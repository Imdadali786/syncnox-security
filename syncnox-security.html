<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syncnox Security and governance</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap');

  body{margin:0;background:#fff}
  #sg{
    --gray-10:#f4f4f4; --gray-20:#e0e0e0; --gray-30:#c6c6c6; --gray-50:#8d8d8d; --gray-70:#525252; --ink:#161616;
    --accent:#015c11; --bright:#00c80d; --g-050:#EAF3DA;
    --red:#da1e28; --red-050:#fff1f1; --orange:#c65300; --orange-050:#fff2e8; --blue:#0f62fe; --purple:#8a3ffc;
    --muted:var(--gray-70); --faint:var(--gray-50);
    --grad:linear-gradient(90deg,#015c11,#00c80d);
    --scr:#FBFCF8; --scr-bar:#F2F4EC; --lane:#E9ECE2;
    --f:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ease:cubic-bezier(.2,0,.38,.9); --ease-soft:cubic-bezier(.16,1,.3,1); --ease-out:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
    font-family:var(--f);color:var(--muted);line-height:1.5;-webkit-font-smoothing:antialiased;
    font-feature-settings:"zero" 0,"ss01" 0;font-variant-numeric:lining-nums tabular-nums;
    background:#fff;padding:clamp(64px,8vw,112px) 0;position:relative;
  }
  #sg *,#sg *::before,#sg *::after{box-sizing:border-box;border-radius:0}
  #sg .wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
  #sg svg.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

  /* header */
  #sg .sec-head{text-align:center;max-width:780px;margin:0 auto clamp(32px,4vw,48px)}
  #sg .eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:inline-flex;align-items:center;gap:10px;margin:0 0 18px}
  #sg .eyebrow::before{content:"";width:22px;height:3px;background:var(--grad)}
  #sg h2{font-weight:400;letter-spacing:-.025em;line-height:1.08;font-size:clamp(30px,3.9vw,46px);margin:0;
    background:linear-gradient(100deg,#0A0A0A 0%,#013a0b 46%,#00c80d 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  #sg h2 .hl{font-weight:600}
  #sg .sec-head p{margin:18px auto 0;font-size:1.06rem;line-height:1.6;max-width:54ch}

  /* three change requests to follow */
  #sg .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:clamp(14px,2.4vw,32px);margin-bottom:20px}
  #sg .tab{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr);gap:13px;align-items:start;padding:18px 0 4px;background:none;border:none;cursor:pointer;font-family:inherit;text-align:left;color:inherit}
  #sg .tab .b2{position:absolute;left:0;right:0;top:0;height:3px;background:var(--gray-10);overflow:hidden}
  #sg .tab .b2 i{display:block;height:100%;width:0;background:var(--lc)}
  #sg .tab.on .b2 i{width:100%}
  #sg .tab.on.run .b2 i{width:0;animation:sgFill var(--dw,7000ms) linear forwards}
  #sg .tab.on.run.hold .b2 i{animation-play-state:paused}
  @keyframes sgFill{to{width:100%}}
  #sg .tab .pi{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--gray-10);color:var(--muted);transition:background .3s,color .3s}
  #sg .tab.on .pi{background:var(--lc);color:#fff}
  #sg .tab small{display:block;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--faint)}
  #sg .tab b{display:block;margin-top:1px;font-size:1rem;font-weight:600;letter-spacing:-.01em;line-height:1.3;color:var(--muted);transition:color .3s}
  #sg .tab.on b,#sg .tab:hover b{color:var(--ink)}
  #sg .tab:focus-visible,#sg .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  /* frame + screen */
  #sg .frame{position:relative;background:linear-gradient(150deg,#000 0%,#013a0b 42%,#00c80d 100%);padding:clamp(10px,2.6vw,34px);overflow:hidden}
  #sg .frame::before{content:"";position:absolute;inset:0;background:radial-gradient(560px circle at var(--mx,24%) var(--my,14%),rgba(90,255,120,.42),rgba(0,200,13,.15) 46%,transparent 74%);pointer-events:none}
  #sg .scr{position:relative;z-index:1;background:var(--scr);box-shadow:0 30px 60px rgba(8,16,4,.45)}
  #sg .bar{display:flex;align-items:center;gap:10px;height:46px;padding:0 6px 0 16px;background:var(--scr-bar);font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink)}
  #sg .bar .sq{width:8px;height:8px;background:var(--accent);flex:none}
  #sg .bar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #sg .bar .t em{font-style:normal;color:var(--faint);font-weight:500}
  #sg .bar .n{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--faint);white-space:nowrap}
  #sg .ib{width:30px;height:30px;flex:none;border:none;background:none;color:var(--faint);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
  #sg .ib:hover{background:#fff;color:var(--ink)}
  #sg .ib svg{width:15px;height:15px}
  #sg .body{padding:14px}

  /* the boundary: everything below happens inside it */
  #sg .zone{position:relative;padding:2px;background:var(--accent);background:linear-gradient(120deg,#015c11,#0a8a1c)}
  #sg .zh{display:flex;align-items:center;gap:11px;padding:9px 14px;color:#fff}
  #sg .zh svg{width:15px;height:15px}
  #sg .zh b{font-size:14px;font-weight:600;letter-spacing:-.005em;white-space:nowrap}
  #sg .zh small{font-size:13px;color:rgba(255,255,255,.78)}
  #sg .zh .tag{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
  #sg .zh .tag i{width:7px;height:7px;background:#7dff7a;animation:sgBlink 1.6s steps(2) infinite}
  @keyframes sgBlink{50%{opacity:.3}}
  #sg .zin{background:var(--scr);display:flex;flex-direction:column;gap:2px;padding:2px}

  /* two lanes into the plan: people above, the agent below */
  #sg .lanes{display:grid;grid-template-columns:minmax(0,.84fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.84fr);grid-template-rows:auto 62px auto;gap:2px}
  #sg #a-p{grid-column:1;grid-row:1} #sg #g-sso{grid-column:2;grid-row:1} #sg #g-rbac{grid-column:3;grid-row:1}
  #sg .road{grid-column:1/4;grid-row:2}
  #sg #a-a{grid-column:1;grid-row:3} #sg #g-auto{grid-column:2;grid-row:3} #sg #g-over{grid-column:3;grid-row:3}
  #sg .plan{grid-column:4;grid-row:1/4}

  #sg .ac,#sg .g,#sg .plan{position:relative;background:#fff;padding:16px 16px 14px;min-width:0;transition:background .35s}
  #sg .hd{display:flex;align-items:center;gap:11px}
  #sg .ti{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--gray-10);color:var(--muted);transition:background .35s,color .35s}
  #sg .ti svg{width:17px;height:17px}
  #sg .hd b{font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.2;color:var(--ink)}
  #sg .lb{display:block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--ink)}
  #sg .lb em{font-style:normal;font-weight:500;letter-spacing:.04em;color:var(--faint);margin-left:6px}
  #sg .ds{display:block;margin-top:9px;font-size:13.5px;line-height:1.4;color:var(--muted)}
  /* who is asking */
  #sg .ac .ti{background:var(--tc);color:#fff}
  #sg .ac .an{display:block;margin-top:1px;font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.2;color:var(--ink)}
  #sg .ac .ar{display:block;margin-top:10px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--faint);min-height:15px}
  #sg .ac .arq{display:block;margin-top:4px;font-size:14.5px;font-weight:500;line-height:1.35;color:var(--ink);min-height:4.05em}
  #sg .ac .tx{transition:opacity .3s var(--ease),transform .45s var(--ease-out)}
  #sg .ac.sw .tx{opacity:0;transform:translateY(5px);transition:none}
  #sg .ac.idle .ti{background:var(--gray-10);color:var(--gray-50)}
  #sg .ac.idle .an,#sg .ac.idle .arq{color:var(--faint);font-weight:400}
  /* a guardrail */
  #sg .g .gb{position:absolute;left:0;right:0;top:0;height:3px;transition:background .3s;overflow:hidden}
  #sg .g.up .gb{top:auto;bottom:0}
  #sg .g.chk .gb::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:var(--ink);animation:sgSweep .52s var(--ease) both}
  @keyframes sgSweep{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
  #sg .gr{display:flex;align-items:flex-start;gap:8px;min-height:38px;margin-top:11px;font-size:13px;line-height:1.35;color:var(--ink)}
  #sg .gm{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--gray-10);color:var(--gray-30);transition:background .3s,color .3s}
  #sg .gm svg{width:11px;height:11px;stroke-width:2.6}
  #sg .gt{font-weight:500}
  #sg .g.idle .gt,#sg .g.chk .gt{color:var(--faint);font-weight:400}
  #sg .g.pop .gm{animation:sgPop .5s var(--spring) both}
  @keyframes sgPop{0%{transform:scale(.4)}100%{transform:none}}
  #sg .g.ok .ti,#sg .g.ok .gm{background:var(--accent);color:#fff}   #sg .g.ok .gb{background:var(--accent)}
  #sg .g.no .ti,#sg .g.no .gm{background:var(--red);color:#fff}      #sg .g.no .gb{background:var(--red)}      #sg .g.no{background:var(--red-050)}
  #sg .g.hold .ti,#sg .g.hold .gm{background:var(--orange);color:#fff} #sg .g.hold .gb{background:var(--orange)} #sg .g.hold{background:var(--orange-050)}
  #sg .g.undo .ti,#sg .g.undo .gm{background:var(--ink);color:#fff}  #sg .g.undo .gb{background:var(--ink)}
  #sg .acts{display:inline-flex;gap:6px;margin:-7px 0 0 10px;vertical-align:middle}
  #sg .acts.solo{margin-left:0}
  #sg .btn{height:30px;padding:0 12px;border:none;background:var(--ink);color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,transform .15s}
  #sg .btn:hover{background:#000}
  #sg .btn:active{transform:translateY(1px)}
  #sg .btn.alt{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--gray-30)}
  #sg .btn.alt:hover{background:var(--gray-10)}
  #sg .btn.auto{animation:sgPress .5s var(--ease) both}
  @keyframes sgPress{40%{transform:scale(.92)}}

  /* the road between them */
  #sg .road{--v:0;position:relative;height:62px}
  #sg .lane{position:absolute;left:0;right:0;height:30px;background:var(--lane);overflow:hidden}
  #sg .lane.l0{top:0} #sg .lane.l1{bottom:0}
  #sg .lane::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(22,22,22,.07) 22px 24px)}
  #sg .fill{position:absolute;left:0;top:0;bottom:0;width:var(--p,0px);background:var(--fc,transparent);opacity:.24;transition:background .3s}
  #sg .gate{position:absolute;left:var(--m,0px);width:4px;margin-left:-2px;height:30px;background:var(--ink);z-index:2;transition:transform .4s var(--ease-out),background .25s}
  #sg .gate.b0{top:0;transform-origin:50% 0} #sg .gate.b1{bottom:0;transform-origin:50% 100%}
  #sg .gate.ok,#sg .gate.open{transform:scaleY(.2)}
  #sg .gate.ok{background:var(--accent)}
  #sg .gate.hold{background:var(--orange)}
  #sg .gate.no{background:var(--red);width:6px;margin-left:-3px}
  #sg .tok{position:absolute;left:0;top:0;width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:var(--tc);color:#fff;box-shadow:0 0 0 2px #fff;opacity:0;z-index:3}
  #sg .tok svg{width:12px;height:12px;stroke-width:2}
  #sg .tok.on{opacity:1}
  #sg .tok.bad{background:var(--red)}
  #sg .tok.bad>span{display:flex;animation:sgShake .4s var(--ease) both}
  @keyframes sgShake{20%{transform:translateX(-3px)}50%{transform:translateX(3px)}80%{transform:translateX(-2px)}}

  /* where every allowed change lands */
  #sg .plan{display:flex;flex-direction:column;justify-content:center;padding:20px 18px}
  #sg .plan::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px var(--pc,transparent);opacity:0;pointer-events:none}
  #sg .plan.flash::before{animation:sgFlash 1.1s var(--ease) both}
  @keyframes sgFlash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
  #sg .plan .pn{display:block;margin-top:16px;font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--ink)}
  #sg .plan .pu{display:block;margin-top:5px;font-size:13.5px;color:var(--muted)}
  #sg .stt{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:6px 12px;margin-top:18px;align-self:flex-start;font-size:13.5px;font-weight:600;line-height:1.25;background:var(--gray-10);color:var(--muted);transition:background .35s,color .35s}
  #sg .stt svg{width:15px;height:15px;stroke-width:2}
  #sg .stt .dot{width:8px;height:8px;flex:none;background:var(--gray-50);animation:sgBlink 1s steps(2) infinite}
  #sg .stt.ok{background:var(--accent);color:#fff}
  #sg .stt.no{background:var(--red);color:#fff}
  #sg .stt.hold{background:var(--orange);color:#fff}
  #sg .stt.undo{background:var(--ink);color:#fff}
  #sg .plan .pl{display:block;margin-top:10px;font-size:13px;line-height:1.4;color:var(--muted);min-height:3.5em}

  /* audit trail: every outcome lands here, including the refusals */
  #sg .log{background:#fff;padding:14px 16px 10px}
  #sg .log .hd small{font-size:13.5px;color:var(--muted)}
  #sg .log .hd>div{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
  #sg .log .ti{background:var(--accent);color:#fff}
  #sg .ll{--lr:38px;height:calc(var(--lr)*3);margin-top:10px;overflow:hidden}
  #sg .lr{display:grid;grid-template-columns:46px 150px minmax(0,1fr) auto;gap:14px;align-items:center;height:var(--lr);font-size:13.5px;color:var(--ink);box-shadow:0 -1px 0 var(--gray-10)}
  #sg .lr.new{animation:sgRow .55s var(--ease-out) both}
  @keyframes sgRow{from{margin-top:calc(var(--lr)*-1);opacity:0}to{margin-top:0;opacity:1}}
  #sg .lr time{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
  #sg .lr .la{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;overflow:hidden}
  #sg .lr .la svg{width:15px;height:15px;color:var(--muted)}
  #sg .lr .lx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
  #sg .lo{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:600;white-space:nowrap}
  #sg .lo i{width:8px;height:8px;background:var(--oc)}
  #sg .fine{margin:16px 0 0;text-align:center;font-size:12.5px;color:var(--faint)}

  #sg .reveal{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease-soft),transform .8s var(--ease-soft)}
  #sg .reveal.in{opacity:1;transform:none}
  #sg .reveal.d1{transition-delay:.1s}

  @media(max-width:940px){
    /* the road turns to run down the left edge */
    #sg .lanes{grid-template-columns:50px minmax(0,1fr);grid-template-rows:none}
    #sg .road{--v:1;grid-column:1;grid-row:1/7;height:auto}
    #sg #a-p{grid-column:2;grid-row:1} #sg #g-sso{grid-column:2;grid-row:2} #sg #g-rbac{grid-column:2;grid-row:3}
    #sg #a-a{grid-column:2;grid-row:4} #sg #g-auto{grid-column:2;grid-row:5} #sg #g-over{grid-column:2;grid-row:6}
    #sg .plan{grid-column:1/3;grid-row:7;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:18px;align-items:center}
    #sg .plan .hd{grid-column:1/3}
    #sg .plan .pn{margin-top:12px;font-size:38px}
    #sg .plan .pu{grid-column:1;margin-top:2px}
    #sg .plan .stt{grid-column:2;grid-row:2/4;margin-top:12px;justify-self:start;align-self:center}
    #sg .plan .pl{grid-column:1/3;min-height:2.8em}
    #sg .lane{left:auto;right:auto;top:0;bottom:0;width:24px;height:auto}
    #sg .lane.l0{left:0} #sg .lane.l1{right:0;top:var(--s1,0px);bottom:0}
    #sg .lane::after{background:repeating-linear-gradient(180deg,transparent 0 22px,rgba(22,22,22,.07) 22px 24px)}
    #sg .fill{right:0;bottom:auto;width:auto;height:var(--p,0px)}
    #sg .gate{left:auto;top:var(--m,0px);width:24px;height:4px;margin:-2px 0 0}
    #sg .gate.b0{left:0;top:var(--m,0px);transform-origin:0 50%} #sg .gate.b1{right:0;top:var(--m,0px);bottom:auto;transform-origin:100% 50%}
    #sg .gate.ok,#sg .gate.open{transform:scaleX(.2)}
    #sg .gate.no{width:24px;height:6px;margin:-3px 0 0}
    #sg .g .gb,#sg .g.up .gb{left:0;right:auto;top:0;bottom:0;width:3px;height:auto}
    #sg .g.chk .gb{background:var(--ink)}
    #sg .g.chk .gb::after{display:none}
    #sg .ac .arq{min-height:2.7em}
    #sg .lr{grid-template-columns:46px 124px minmax(0,1fr) auto;gap:10px}
  }
  @media(max-width:720px){
    #sg .tabs{grid-template-columns:minmax(0,1fr);row-gap:2px;margin-bottom:16px}
    #sg .tab{padding:10px 0 10px 14px;align-items:center}
    #sg .tab .b2{right:auto;bottom:0;width:3px;height:auto}
    #sg .tab .b2 i{width:100%!important;height:0}
    #sg .tab.on .b2 i{height:100%}
    #sg .tab.on.run .b2 i{height:0;animation:sgFillV var(--dw,7000ms) linear forwards}
    @keyframes sgFillV{to{height:100%}}
  }
  @media(max-width:640px){
    #sg .bar{font-size:10.5px;gap:8px;padding-left:12px}
    #sg .bar .t em{display:none}
    #sg .bar .n{font-size:9px;letter-spacing:.06em}
    #sg .body{padding:8px}
    #sg .zh{flex-wrap:wrap;gap:4px 10px;padding:9px 12px}
    #sg .zh small{order:3;flex-basis:100%}
    #sg .ac,#sg .g{padding:14px 12px 12px}
    #sg .log{padding:12px 12px 8px}
    #sg .ll{--lr:54px}
    #sg .lr{grid-template-columns:42px minmax(0,1fr) auto;grid-template-rows:auto auto;gap:1px 8px;align-content:center;font-size:13px}
    #sg .lr .lx{grid-column:2/-1;grid-row:2}
    #sg .lr time{grid-row:1/3;align-self:center}
    #sg .lr .la{font-size:12.5px;gap:6px}
    #sg .lr .la svg{width:14px;height:14px}
    #sg .lo{font-size:10px}
  }
  @media(prefers-reduced-motion:reduce){
    #sg *{animation:none!important;transition:none!important}
    #sg .reveal{opacity:1;transform:none}
  }
</style>
</head>
<body>

<section id="sg" aria-labelledby="sgTitle">
  <div class="wrap">
    <div class="sec-head reveal">
      <span class="eyebrow">Security &amp; governance</span>
      <h2 id="sgTitle">Autonomy <span class="hl">with guardrails.</span></h2>
      <p>Enterprise control over who, and what, can change the plan.</p>
    </div>

    <div class="reveal d1">
      <div class="tabs" id="sgTabs" role="tablist" aria-label="Example change requests"></div>
      <div class="frame" id="sgFrame">
        <div class="scr">
          <div class="bar"><span class="sq"></span><span class="t">Change control <em>· two lanes into the plan</em></span><span class="n">ILLUSTRATIVE EXAMPLE</span>
            <button type="button" class="ib" id="sgPlay" aria-label="Pause"></button></div>
          <div class="body">
            <div class="zone">
              <div class="zh" id="sgZh"></div>
              <div class="zin">
                <div class="lanes" id="sgL"></div>
                <div class="log"><div class="hd" id="sgLh"></div><div class="ll" id="sgLog" aria-live="polite"></div></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <p class="fine">Illustrative example. Names, limits and times are placeholders.</p>
    </div>
  </div>
</section>

<script>
(function(){
  var root=document.getElementById('sg'); if(!root) return;

<script>
/* iframe helper: report real height to the parent page */
(function(){
  if(window.parent===window)return;
  var last=0;
  function send(){
    var h=Math.ceil(document.documentElement.getBoundingClientRect().height);
    if(h&&h!==last){last=h;window.parent.postMessage({syncnoxFrame:'security',height:h},'*');}
  }
  if('ResizeObserver' in window){new ResizeObserver(send).observe(document.documentElement);}
  window.addEventListener('load',send);
  window.addEventListener('resize',send);
  send();
